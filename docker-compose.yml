services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compai
      POSTGRES_PASSWORD: compai
      POSTGRES_DB: compai
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compai"]
      interval: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports: ["8000:8000"]
    volumes: [chroma_data:/data]
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

volumes:
  postgres_data:
  chroma_data:
  redis_data:
